[project]
name = "databricks-retail-assistant"
version = "0.1.0"
description = "Retail shopping assistant powered by LangGraph and Neo4j Agent Memory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Agent orchestration
    "langgraph>=1.0.8",
    "langgraph-prebuilt>=1.0.4",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",

    # Neo4j Agent Memory (LangChain integration)
    "neo4j-agent-memory[openai,langchain] @ file:///Users/ryanknight/projects/neo4j-labs/agent-memory",

    # Web framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sse-starlette>=1.6.0",

    # Environment and config
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
